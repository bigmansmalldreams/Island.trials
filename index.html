<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Island Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
    body{
        margin: 0;
    }
    .title-screen{    
        text-align: center;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        box-sizing: border-box;
        width: 100%;
        background-image: url("test.png");
        animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn {
        from {
        opacity: 0;
        }

        to {
        opacity: 1;
        }
    }
    @keyframes titleIn {
        from {
        opacity: 0;
        transform: translateY(-30px);
        }

        to {
        opacity: 1;
        transform: translateY(0);
        
        }
    }
    @keyframes subtitleIn {
        from {
        opacity: 0;
        transform: translateY(15px);
        }

        to {
        opacity: 0.8;
        transform: translateY(0);
        }
   }
   @keyframes buttonIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }
    .title-screen h1{
        margin: 0;
        animation: titleIn 1s ease-out forwards;
        
    }
    .title-screen p {
        opacity: 0;
        font-size: 20px;
        margin: 0;
        color: #ccc;
        Font-family: "Press Start 2P", Sans-Serif;
        animation: subtitleIn 1s ease-out 0.5s both;
    }
    .title-screen button{
        font-size: 18px;
        padding: 12px 24px;
        border-radius: 15px;
        background-color: #333;
        color: white;
        cursor: pointer;
        font-family: "Press Start 2P", Sans-Serif;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        background: #333;
        border: 2px solid #555;
        opacity: 0;
        animation: buttonIn 1s ease-out 1s both;
        transition: 0.5s;
        position: relative;
        z-index: 10;
    }
    .title-screen button:hover {
        background-color: #555;
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        border-color: #888;
    }
    .title-screen button:active {
        transform: scale(0.98);
    }
    .game-screen{
        width: 100%;
        height: 100vh;
    }
    </style>
</head>

<body>
    <div class="title-screen">
        <h1>
            <img src="gamma.png" alt="Island Trials" style="width: 300px; height: 200px;">
        </h1>
            <p>welcome to the Island!</p>
        <button>START GAME</button>
        </div>
        <div class="game-screen">
            <div class="player"></div>
        </div>
    <script>
       
    </script>

</body>
</html>
